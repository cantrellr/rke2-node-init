name: Release Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v3.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Build release package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          bash scripts/package-release.sh "${{ steps.version.outputs.version }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rke2-node-init-${{ steps.version.outputs.version }}
          path: |
            dist/rke2-node-init-${{ steps.version.outputs.version }}.tar.gz
            dist/rke2-node-init-${{ steps.version.outputs.version }}.zip
            dist/rke2-node-init-${{ steps.version.outputs.version }}.sha256
            dist/rke2-node-init-${{ steps.version.outputs.version }}.manifest.txt
          retention-days: 90

      - name: Create or update GitHub release for tag builds
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes_file="docs/releases/${VERSION#v}.md"
          if [[ ! -f "${notes_file}" ]]; then
            notes_file="CHANGELOG.md"
          fi

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" \
              "dist/rke2-node-init-${VERSION}.tar.gz" \
              "dist/rke2-node-init-${VERSION}.zip" \
              "dist/rke2-node-init-${VERSION}.sha256" \
              "dist/rke2-node-init-${VERSION}.manifest.txt" \
              --clobber
          else
            gh release create "${VERSION}" \
              "dist/rke2-node-init-${VERSION}.tar.gz" \
              "dist/rke2-node-init-${VERSION}.zip" \
              "dist/rke2-node-init-${VERSION}.sha256" \
              "dist/rke2-node-init-${VERSION}.manifest.txt" \
              --title "rke2-node-init ${VERSION}" \
              --notes-file "${notes_file}" \
              --latest
          fi
