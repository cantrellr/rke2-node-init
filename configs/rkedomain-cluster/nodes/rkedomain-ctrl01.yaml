apiVersion: rkeprep/v2
kind: Server
metadata:
  name: rkedomain-ctrl01
spec:
  hostname: rkedomain-ctrl01
  # Bind to cluster communication interface
  nodeIp: 172.16.8.111
  bindAddress: 172.16.8.111
  advertiseAddress: 172.16.8.111
  cni:
   - multus
   - canal
  interfaces:
    # vlan30
    - name: eth0
      ip: 172.16.8.111
      prefix: 24
      gateway: 172.16.8.1
      dns: ["172.16.10.11", "172.16.10.12"]
      searchDomains: ["k8.cantrellcloud.net", "cantrellcloud.net", "cantrelloffice.cloud", "cantrell.cloud"]
  node-label:
  - "env=production"

  tokenFile: /rke2-node-init/outputs/image-hyperv-rkedomain-v1.35.6+rke2r1-bootstrap-token.txt
  customCA:
    rootCrt: /rke2-node-init/configs/rkedomain-cluster/certs/cocloud-ca.crt
    rootKey: /rke2-node-init/configs/rkedomain-cluster/certs/cocloud-ca-key.pem
    intermediateCrt: /rke2-node-init/configs/rkedomain-cluster/certs/cocloud-issue-ca2.crt
    intermediateKey: /rke2-node-init/configs/rkedomain-cluster/certs/cocloud-issue-ca2-key.pem
    installToOSTrust: true
  disable:
  - rke2-ingress-nginx
  - rke2-traefik
  tls-san:
    - rkedomain-ctrl01.k8.cantrellcloud.net
    - rkedomain.cantrelloffice.cloud
    - 172.16.8.111
  service-cidr: 10.1.0.0/16
  cluster-cidr: 10.101.0.0/16
  cluster-domain: cluster.local
  enable-servicelb: "false"
  kube-apiserver-arg:
    - "audit-log-maxage=15"
  disable-default-system-registry: true
