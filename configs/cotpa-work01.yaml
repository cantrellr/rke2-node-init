apiVersion: rkeprep/v2
kind: Agent
metadata:
  name: cotpa-work01
spec:
  disable-default-system-registry: true
  hostname: cotpa-work01
  # Bind to cluster communication interface
  nodeIp: 172.16.15.111
  bindAddress: 172.16.15.111
  advertiseAddress: 172.16.15.111
  cni:
   - multus
   - canal
  interfaces:
    - name: eth0
      ip: 172.16.15.111
      prefix: 24
      gateway: 172.16.15.1
      dns: ["172.16.10.11", "172.16.10.12"]
      searchDomains: ["k8.cantrellcloud.net","cantrellcloud.net", "cantrelloffice.cloud"]
  serverURL: https://172.16.15.101:9345
  tokenFile: /rke2-node-init/outputs/cotpa-ca-bootstrap-token.txt
  node-label:
  - "role=worker"
  - "env=preprod"
  customCA:
    rootCrt: /rke2-node-init/certs/root-ca.crt
    rootKey: /rke2-node-init/certs/root-ca-key.pem
    intermediateCrt: /rke2-node-init/certs/subordinate-ca.crt
    intermediateKey: /rke2-node-init/certs/subordinate-ca-key.pem
    installToOSTrust: true
  disable:
  - rke2-ingress-nginx
