apiVersion: rkeprep/v2
kind: Agent
metadata:
  name: blrerkedev-work03
spec:
  hostname: blrerkedev-work03
  # Bind to cluster communication interface
  nodeIp: 172.16.8.117
  bindAddress: 172.16.8.117
  advertiseAddress: 172.16.8.117
  cni:
   - multus
   - canal
  interfaces:
    # vlan30
    - name: eth0
      ip: 172.16.8.117
      prefix: 24
      gateway: 172.16.8.1
      dns: ["172.16.10.11", "172.16.10.12"]
      searchDomains: ["k8.cantrellcloud.net","cantrellcloud.net", "cantrelloffice.cloud", "cantrell.cloud"]
  node-label:
  - "role=worker"
  - "env=production"
  tokenFile: /etc/rancher/rke2/token.d/bootstrap.token
  customCA:
    rootCrt: /rke2-node-init/configs/blrerkedev-cluster/certs/cocloud-ca.crt
    rootKey: /rke2-node-init/configs/blrerkedev-cluster/certs/cocloud-ca-key.pem
    intermediateCrt: /rke2-node-init/configs/blrerkedev-cluster/certs/cocloud-issue-ca2.crt
    intermediateKey: /rke2-node-init/configs/blrerkedev-cluster/certs/cocloud-issue-ca2-key.pem
    installToOSTrust: true
  disable:
  - rke2-ingress-nginx
  - rke2-traefik
  serverURL: https://172.16.8.111:9345
