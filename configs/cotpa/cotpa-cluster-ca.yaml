apiVersion: rkeprep/v2
kind: CustomCA
metadata:
  name: cocloud-ca
spec:
  customCA:
    rootCrt: /rke2-node-init/certs/cocloud/root-ca.crt
    rootKey: /rke2-node-init/certs/cocloud/root-ca-key.pem
    intermediateCrt: /rke2-node-init/certs/cocloud/intermediate-ca.crt
    intermediateKey: /rke2-node-init/certs/cocloud/intermediate-ca-key.pem
    installToOSTrust: true
