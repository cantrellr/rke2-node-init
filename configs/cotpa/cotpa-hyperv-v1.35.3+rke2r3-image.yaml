apiVersion: rkeprep/v2
kind: Image
metadata:
  name: cotpa-hyperv-v1.35.3+rke2r3-image
spec:
  cni:
   - multus
   - canal
  fixCNIPermissions: false
 # registry: kuberegistry.k8.cantrellcloud.net:8443/rke2
  embedded-registry: true
  disable-default-registry-endpoint: true
  defaultDns: [172.16.10.11, 172.16.10.12]
  defaultSearchDomains: [k8.cantrellcloud.net, cantrellcloud.net, cantrelloffice.cloud]
  customCA:
    rootCrt: /rke2-node-init/certs/cocloud/cocloud-ca.crt
    rootKey: /rke2-node-init/certs/cocloud/cocloud-ca-key.pem
    intermediateCrt: /rke2-node-init/certs/cocloud/cocloud-issue-ca2.crt
    intermediateKey: /rke2-node-init/certs/cocloud/cocloud-issue-ca2-key.pem
    installToOSTrust: true
  bootService:
    enabled: true
    yamlPath: configs/cotpa/nodes
    mode: oneshot
    platform: hyperv
