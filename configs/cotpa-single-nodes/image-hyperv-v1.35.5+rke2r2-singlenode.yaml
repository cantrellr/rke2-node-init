apiVersion: rkeprep/v2
kind: singleNodeImage
metadata:
  name: image-hyperv-v1.35.5+rke2r2-singlenode
spec:
  rke2Version: v1.35.5+rke2r2

  clusterMode: single-node

  cni:
    - multus
    - canal

  fixCNIPermissions: false

  embedded-registry: true
  disable-default-registry-endpoint: true

  # Keep image-level DNS in scalar CSV form for the base image engine.
  # Node-level interface DNS can still use YAML list syntax.
  defaultDns: 172.16.10.11,172.16.10.12
  defaultSearchDomains: k8.cantrellcloud.net,cantrellcloud.net

  customCA:
    rootCrt: /rke2-node-init/configs/cotpa/certs/cocloud-ca.crt
    rootKey: /rke2-node-init/configs/cotpa/certs/cocloud-ca-key.pem
    intermediateCrt: /rke2-node-init/configs/cotpa/certs/cocloud-issue-ca2.crt
    intermediateKey: /rke2-node-init/configs/cotpa/certs/cocloud-issue-ca2-key.pem
    installToOSTrust: true

  # COTPA single-node servers should be provisioned with:
  #   sudo bash bin/rke2-single-node-profile.sh -f <node-yaml> -y
  # That wrapper dispatches kind: singleNodeServer by applying the single-node
  # overlay before delegating to the existing rke2nodeinit.sh server action.
  # Keep bootService disabled here so a cloned VM does not bypass the overlay on
  # first boot.
  bootService:
    enabled: false
    yamlPath: configs/cotpa-single-nodes/nodes
    mode: oneshot
    platform: hyperv
