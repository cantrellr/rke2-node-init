apiVersion: rkeprep/v2
kind: singleNodeServer
metadata:
  name: dc1domain
spec:
  rke2Version: v1.35.5+rke2r2

  clusterMode: single-node
  singleNode:
    enabled: true
    mode: production
    enableCIS: true
    lowResourceAddons: true
    defaultNetworkPolicy: true
    ingressController: none
    snapshotScheduleCron: "0 */6 * * *"
    snapshotRetention: 12
    snapshotDir: /var/lib/rancher/rke2/server/db/snapshots
    auditLogMaxAge: 30
    auditLogMaxBackup: 10
    auditLogMaxSize: 100

  node-label:
    - node-role.kubernetes.io/control-plane=true
    - node-role.kubernetes.io/worker=true
    - cluster.cantrellnet.net/mode=single-node
    - topology.kubernetes.io/zone=single-node

  disable-default-system-registry: true

  hostname: dc1domain
  nodeIp: 172.16.15.102
  bindAddress: 172.16.15.102
  advertiseAddress: 172.16.15.102
  cni:
    - multus
    - canal
  interfaces:
    - name: eth0
      ip: 172.16.15.102
      prefix: 24
      gateway: 172.16.15.1
      dns: ["172.16.10.11", "172.16.10.12"]
      searchDomains: ["k8.cantrellcloud.net", "cantrellcloud.net"]
    - name: eth1
      ip: 172.16.210.102
      prefix: 24
      gateway:
      dns:
      searchDomains: ["cantrelloffice.cloud", "cantrell.cloud"]

  tokenFile: /rke2-node-init/outputs/image-hyperv-v1.35.5+rke2r2-singlenode/image-hyperv-v1.35.5+rke2r2-singlenode-bootstrap-token.txt
  customCA:
    rootCrt: /rke2-node-init/configs/cotpa/certs/cocloud-ca.crt
    rootKey: /rke2-node-init/configs/cotpa/certs/cocloud-ca-key.pem
    intermediateCrt: /rke2-node-init/configs/cotpa/certs/cocloud-issue-ca2.crt
    intermediateKey: /rke2-node-init/configs/cotpa/certs/cocloud-issue-ca2-key.pem
    installToOSTrust: true
  disable:
    - rke2-ingress-nginx
    - rke2-traefik
  tls-san:
    - dc1domain
    - dc1domain.cantrellcloud.net
    - 172.16.15.102
  service-cidr: 10.1.0.0/16
  cluster-dns: 10.1.0.10
  cluster-cidr: 10.102.0.0/16
  cluster-domain: cluster.local
  enable-servicelb: "false"
  writeKubeconfigMode: "0600"
