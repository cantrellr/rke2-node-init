apiVersion: rkeprep/v2
kind: singleNodeServer
metadata:
  name: rke2-single01
spec:
  clusterMode: single-node
  rke2Version: v1.34.1+rke2r1

  registry: registry.example.internal/rke2
  registryUsername: admin
  registryPassword: CHANGE_ME
  systemDefaultRegistry: registry.example.internal/rke2
  disableDefaultRegistryEndpoint: true

  interfaces:
    - name: ens33
      ip: 10.0.4.21
      prefix: 24
      gateway: 10.0.4.1
      dns:
        - 10.0.1.34
        - 10.231.1.34
      searchDomains:
        - dev.kube
        - cantrelloffice.cloud

  nodeName: rke2-single01
  nodeIp: 10.0.4.21
  bindAddress: 10.0.4.21
  advertiseAddress: 10.0.4.21
  writeKubeconfigMode: "0600"

  tls-san:
    - rke2-single01
    - rke2-single01.dev.kube
    - 10.0.4.21

  cni:
    - canal

  node-label:
    - cluster.cantrellcloud.net/mode=single-node
    - topology.kubernetes.io/zone=single-node

  # Consumed by bin/rke2nodeinit.sh before the normal server action.
  singleNode:
    enabled: true
    mode: production
    enableCIS: true
    lowResourceAddons: true
    defaultNetworkPolicy: true
    ingressController: none
    snapshotScheduleCron: "0 */6 * * *"
    snapshotRetention: 12
    snapshotDir: /var/lib/rancher/rke2/server/db/snapshots
    auditLogMaxAge: 30
    auditLogMaxBackup: 10
    auditLogMaxSize: 100

  disable:
    - rke2-ingress-nginx
    - rke2-traefik
    - rke2-traefik-crd

  service-cidr: 10.43.0.0/16
  cluster-cidr: 10.42.0.0/16
  cluster-dns: 10.43.0.10
  cluster-domain: cluster.local
