apiVersion: rkeprep/v2
kind: Agent
metadata:
  name: dc1manager-work01
spec:
  hostname: dc1manager-work01
  # Bind to cluster communication interface
  nodeIp: 10.1.1.218
  bindAddress: 10.1.1.218
  advertiseAddress: 10.1.1.218
  cni:
   - multus
   - canal
  interfaces:
    - name: ens33
      ip: 10.1.1.218
      prefix: 24
      gateway: 10.1.1.1
      dns: ["4.2.2.2"]
      searchDomains: [dev.kube, dev.local]
    - name: ens35
      ip: 172.16.69.62
      prefix: 24
      gateway:
      dns: 
      searchDomains: 
    - name: ens36
      ip: 172.16.255.242
      prefix: 24
      gateway:
      dns: 
      searchDomains: 
  serverURL: https://10.1.1.215:9345
  tokenFile: /rke2-node-init/outputs/dc1manager-ca-bootstrap-token.txt
  node-label:
  - "role=worker"
  - "env=preprod"
  customCA:
    rootCrt: /rke2-node-init/certs/scripts/outputs/root-ca/root-ca.crt
    rootKey: /rke2-node-init/certs/scripts/outputs/root-ca/root-ca-key.pem
    installToOSTrust: true
  disable:
  - rke2-ingress-nginx
