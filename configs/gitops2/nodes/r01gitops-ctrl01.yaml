apiVersion: rkeprep/v2
kind: Server
metadata:
  name: r01gitops-ctrl01
spec:
  hostname: r01gitops-ctrl01
  # Bind to cluster communication interface
  nodeIp: 10.0.4.151
  bindAddress: 10.0.4.151
  advertiseAddress: 10.0.4.151
  cni:
   - multus
   - canal
  interfaces:
    # Primary
    - name: ens33
      ip: 10.0.4.151
      prefix: 24
      gateway: 10.0.4.1
      dns: ["10.0.1.34", "10.231.1.34"]
      searchDomains: ["dev.kube", "dev.local"]
    # Storage
    - name: ens35
      ip: 172.16.0.181
      prefix: 24
      gateway:
      dns: []
      searchDomains: []
    # Segment1
    - name: ens36
      ip: 1.0.0.201
      prefix: 24
      gateway:
      dns: []
      searchDomains: []
  node-taint:
  - "node-role.kubernetes.io/control-plane:NoSchedule"
  node-label:
  - "env=preprod-gitops"
  tls-san:
    - r01gitops-ctrl01
    - r01gitops-ctrl01.dev.kube
    - r01gitops-cluster
    - r01gitops-cluster.dev.kube
    - 10.0.4.151
  service-cidr: 10.92.0.0/16
  cluster-cidr: 10.242.0.0/16
  cluster-domain: cluster.local
  enable-servicelb: "false"
  embedded-registry: true
  disable-default-registry-endpoint: true
  kube-apiserver-arg:
    - "audit-log-maxage=15"
  tokenFile: /rke2-node-init/outputs/devlocal-ca/devlocal-ca-bootstrap-token.txt
  customCA:
    rootCrt: /rke2-node-init/configs/preprod/certs/dev-certa001-ca-dev-local.crt
    rootKey: /rke2-node-init/configs/preprod/certs/dev-certa001-ca-dev-local-key.pem
    installToOSTrust: true
  disable:
  - rke2-ingress-nginx
  - rke2-ingress-traefik
