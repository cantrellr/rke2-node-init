apiVersion: rkeprep/v2
kind: Agent
metadata:
  name: r01gitops-work01
spec:
  hostname: r01gitops-work01
  # Bind to cluster communication interface
  nodeIp: 10.0.4.155
  bindAddress: 10.0.4.155
  advertiseAddress: 10.0.4.155
  cni:
   - multus
   - canal
  interfaces:
    # Primary
    - name: ens33
      ip: 10.0.4.155
      prefix: 24
      gateway: 10.0.4.1
      dns: ["10.0.1.34", "10.231.1.34"]
      searchDomains: ["dev.kube", "dev.local"]
    # Storage
    - name: ens35
      ip: 172.16.0.185
      prefix: 24
      gateway:
      dns: []
      searchDomains: []
    # Segment1
    - name: ens36
      ip: 1.0.0.205
      prefix: 24
      gateway:
      dns: []
      searchDomains: []
  embedded-registry: true
  disable-default-registry-endpoint: true
  serverURL: https://10.0.4.151:9345
  tokenFile: /rke2-node-init/outputs/devlocal-ca-bootstrap-token.txt
  node-label:
  - "role=worker"
  - "env=preprod-gitops"
  customCA:
    rootCrt: /rke2-node-init/configs/preprod/certs/dev-certa001-ca-dev-local.crt
    rootKey: /rke2-node-init/configs/preprod/certs/dev-certa001-ca-dev-local-key.pem
    installToOSTrust: true
  disable:
  - rke2-ingress-nginx
  - rke2-ingress-traefik
