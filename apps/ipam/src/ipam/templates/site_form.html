{% extends "base.html" %}

{% block page_title %}{% if site %}Edit Site{% else %}New Site{% endif %}{% endblock %}

{% block content %}
  <section class="panel form-panel">
    <div class="panel-header">
      <h2>{% if site %}Edit {{ site.name }}{% else %}Create Site{% endif %}</h2>
    </div>
    <form class="stacked-form" action="{{ action }}" method="post">
      <label>
        <span>Name</span>
        <input type="text" name="name" value="{{ site.name if site else '' }}" required>
      </label>
      <label>
        <span>Code</span>
        <input type="text" name="code" value="{{ site.code if site else '' }}">
      </label>
      <label>
        <span>Location</span>
        <input type="text" name="location" value="{{ site.location if site else '' }}">
      </label>
      <label>
        <span>Environment</span>
        <input type="text" name="environment" value="{{ site.environment if site else '' }}">
      </label>
      <label>
        <span>Notes</span>
        <textarea name="notes" rows="5">{{ site.notes if site else '' }}</textarea>
      </label>
      <div class="form-actions">
        <a class="button button-secondary" href="/sites">Cancel</a>
        <button class="button" type="submit">Save Site</button>
      </div>
    </form>
  </section>
{% endblock %}
