{% extends "base.html" %}

{% block page_title %}{% if network %}Edit Network{% else %}New Network{% endif %}{% endblock %}

{% block content %}
  <section class="panel form-panel">
    <div class="panel-header">
      <h2>{% if network %}Edit {{ network.name or network.cidr }}{% else %}Create Network{% endif %}</h2>
    </div>
    <form class="stacked-form" action="{{ action }}" method="post">
      <label>
        <span>Site</span>
        <select name="site_id">
          <option value="">Unassigned</option>
          {% for site in sites %}
            <option value="{{ site.id }}" {% if network and network.site_id == site.id %}selected{% endif %}>{{ site.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span>Name</span>
        <input type="text" name="name" value="{{ network.name if network else '' }}">
      </label>
      <label>
        <span>CIDR</span>
        <input type="text" name="cidr" value="{{ network.cidr if network else '' }}" placeholder="10.1.1.0/24">
      </label>
      <label>
        <span>VLAN ID</span>
        <input type="text" name="vlan_id" value="{{ network.vlan_id if network else '' }}">
      </label>
      <label>
        <span>Gateway</span>
        <input type="text" name="gateway" value="{{ network.gateway if network else '' }}">
      </label>
      <label>
        <span>DNS Servers</span>
        <input type="text" name="dns_servers" value="{{ network.dns_servers | join(', ') if network else '' }}" placeholder="172.16.10.11, 172.16.10.12">
      </label>
      <label>
        <span>Search Domains</span>
        <input type="text" name="search_domains" value="{{ network.search_domains | join(', ') if network else '' }}" placeholder="dev.kube, dev.local">
      </label>
      <label>
        <span>Notes</span>
        <textarea name="notes" rows="5">{{ network.notes if network else '' }}</textarea>
      </label>
      <div class="form-actions">
        <a class="button button-secondary" href="/networks">Cancel</a>
        <button class="button" type="submit">Save Network</button>
      </div>
    </form>
  </section>
{% endblock %}
