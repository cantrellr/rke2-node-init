{% extends "base.html" %}

{% block page_title %}{% if assignment %}Edit Assignment{% else %}New Assignment{% endif %}{% endblock %}

{% block content %}
  <section class="panel form-panel">
    <div class="panel-header">
      <h2>{% if assignment %}Edit {{ assignment.ip_address }}{% else %}Create Assignment{% endif %}</h2>
    </div>
    <form class="stacked-form" action="{{ action }}" method="post">
      <label>
        <span>Site</span>
        <select name="site_id">
          <option value="">Unassigned</option>
          {% for site in sites %}
            <option value="{{ site.id }}" {% if assignment and assignment.site_id == site.id %}selected{% endif %}>{{ site.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span>Network</span>
        <select name="network_id">
          <option value="">No network selected</option>
          {% for network in networks %}
            <option value="{{ network.id }}" {% if assignment and assignment.network_id == network.id %}selected{% endif %}>
              {{ network.site.name if network.site else 'No site' }} :: {{ network.name or network.cidr or 'Unnamed network' }}
            </option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span>IP Address</span>
        <input type="text" name="ip_address" value="{{ assignment.ip_address if assignment else '' }}" required>
      </label>
      <label>
        <span>Hostname</span>
        <input type="text" name="hostname" value="{{ assignment.hostname if assignment else '' }}">
      </label>
      <label>
        <span>Interface Name</span>
        <input type="text" name="interface_name" value="{{ assignment.interface_name if assignment else '' }}">
      </label>
      <label>
        <span>Role</span>
        <input type="text" name="role" value="{{ assignment.role if assignment else '' }}" placeholder="control-plane, worker, gateway">
      </label>
      <label>
        <span>Status</span>
        <select name="status">
          {% set current_status = assignment.status if assignment else 'assigned' %}
          {% for option in ['assigned', 'reserved', 'planned', 'retired'] %}
            <option value="{{ option }}" {% if current_status == option %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span>Gateway</span>
        <input type="text" name="gateway" value="{{ assignment.gateway if assignment else '' }}">
      </label>
      <label>
        <span>DNS Servers</span>
        <input type="text" name="dns_servers" value="{{ assignment.dns_servers | join(', ') if assignment else '' }}">
      </label>
      <label>
        <span>Search Domains</span>
        <input type="text" name="search_domains" value="{{ assignment.search_domains | join(', ') if assignment else '' }}">
      </label>
      <label>
        <span>Description</span>
        <textarea name="description" rows="5">{{ assignment.description if assignment else '' }}</textarea>
      </label>
      <div class="form-actions">
        <a class="button button-secondary" href="/assignments">Cancel</a>
        <button class="button" type="submit">Save Assignment</button>
      </div>
    </form>
  </section>
{% endblock %}
