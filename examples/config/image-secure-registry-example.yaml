apiVersion: rkeprep/v2
kind: Image
metadata:
  name: rke2-secure-registry-image
  description: Prepare an RKE2 image with authenticated private-registry access

spec:
  rke2Version: v1.35.6+rke2r1

  # Registry host or host/namespace used by RKE2.
  registry: kubeharbor.dev.kube

  # Fail closed unless registry credentials can be resolved. The credentials are
  # injected only into a temporary root-only runtime manifest and are then used
  # by the existing renderer to create /etc/rancher/rke2/registries.yaml.
  secureRegistry: true

  # Preferred: keep credentials outside Git. Relative paths are resolved from
  # this manifest's directory. Both files should be protected with chmod 600.
  registryUsernameFile: /root/.config/rke2-node-init/kubeharbor-pull-username
  registryPasswordFile: /root/.config/rke2-node-init/kubeharbor-pull-token

  # Optional private CA trust for the registry.
  # customCA:
  #   rootCrt: /root/.config/rke2-node-init/kubeharbor-ca.crt
  #   installToOSTrust: true
