---
apiVersion: rkeprep/v2
kind: AgentConfig

metadata:
  name: cotpa-worker01
  cluster: cotpa

# Network configuration
networking:
  interface: eth0
  ipAddress: 192.168.1.20
  prefix: 24
  gateway: 192.168.1.1
  dns:
    - 192.168.1.1
  searchDomains:
    - cotpa.local

# Hostname configuration
hostname: cotpa-worker01

# RKE2 configuration
rke2:
  version: v1.30.0+rke2r1
  role: agent
  
  # Join existing cluster
  serverUrl: https://192.168.1.10:9345
  token: ${CLUSTER_TOKEN}  # Set by administrator

# Registry configuration (for air-gapped)
registry: registry.cotpa.local
registryUsername: admin
registryPassword: changeme

# Boot service configuration
bootService:
  enabled: true
  mode: auto
