---
apiVersion: rkeprep/v2
kind: ServerConfig

metadata:
  name: cotpa-ctrl01
  cluster: cotpa

# Network configuration
networking:
  interface: eth0
  ipAddress: 192.168.1.10
  prefix: 24
  gateway: 192.168.1.1
  dns:
    - 192.168.1.1
  searchDomains:
    - cotpa.local

# Hostname configuration
hostname: cotpa-ctrl01

# RKE2 configuration
rke2:
  version: v1.30.0+rke2r1
  role: server
  
  # First server node generates token
  clusterInit: true
  
  # TLS SANs for API server
  tlsSans:
    - cotpa-ctrl01
    - cotpa-ctrl01.cotpa.local
    - 192.168.1.10
    - cotpa-api.cotpa.local
  
  # Disable unused components
  disableComponents:
    - rke2-ingress-nginx
  
  # CNI configuration
  cni: canal

# Registry configuration (for air-gapped)
registry: registry.cotpa.local
registryUsername: admin
registryPassword: changeme

# Optional: Custom CA for registry
# customCA:
#   rootCrt: certs/root-ca.crt
#   rootKey: certs/root-ca.key

# Boot service configuration
bootService:
  enabled: true
  mode: auto
