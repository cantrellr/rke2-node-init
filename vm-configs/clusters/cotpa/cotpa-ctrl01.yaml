---
apiVersion: vmconfig/v1
kind: VirtualMachineConfig
metadata:
  name: cotpa-ctrl01
  cluster: cotpa
  environment: production
  labels:
    role: control-plane
    tier: infrastructure

spec:
  hypervisor:
    type: hyperv
    connection:
      host: hyperv-host.example.com
      credentialsSecret: HYPERV_CREDENTIALS
    
    vmSettings:
      templateName: ubuntu22-rke2-template
      network: "Internal Network"
      cpus: 4
      memoryMB: 8192
    
    guestVariables:
      # These variables will be set via Hyper-V KVP and readable by guest
      VirtualMachineName: cotpa-ctrl01
      ClusterName: cotpa
      NodeRole: server
      RKE2ConfigPath: /rke2-node-init/configs/cotpa-ctrl01.yaml

  rke2Config:
    role: server
    configPath: clusters/cotpa/rke2-configs/cotpa-ctrl01.yaml
    autoStart: true

  operations:
    onCreate:
      - "echo 'VM cotpa-ctrl01 created successfully'"
    onUpdate:
      - "echo 'VM cotpa-ctrl01 configuration updated'"
