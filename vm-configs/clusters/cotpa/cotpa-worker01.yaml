---
apiVersion: vmconfig/v1
kind: VirtualMachineConfig
metadata:
  name: cotpa-worker01
  cluster: cotpa
  environment: production
  labels:
    role: worker
    tier: compute

spec:
  hypervisor:
    type: hyperv
    connection:
      host: hyperv-host.example.com
      credentialsSecret: HYPERV_CREDENTIALS
    
    vmSettings:
      templateName: ubuntu22-rke2-template
      network: "Internal Network"
      cpus: 8
      memoryMB: 16384
    
    guestVariables:
      VirtualMachineName: cotpa-worker01
      ClusterName: cotpa
      NodeRole: agent
      RKE2ConfigPath: /rke2-node-init/configs/cotpa-worker01.yaml

  rke2Config:
    role: agent
    configPath: clusters/cotpa/rke2-configs/cotpa-worker01.yaml
    autoStart: true

  operations:
    onCreate:
      - "echo 'VM cotpa-worker01 created successfully'"
